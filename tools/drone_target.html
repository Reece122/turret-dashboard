<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Drone Target Range</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

  /* Sky */
  #sky {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #4a90d9 0%, #7fb5e6 55%, #cfe6f5 100%);
    overflow: hidden;
  }
  .cloud {
    position: absolute;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    will-change: transform;
  }

  /* Drone */
  .drone { position: absolute; left: 0; top: 0; will-change: transform; }
  .drone svg, .drone img { display: block; overflow: visible; -webkit-user-drag: none; }
  .ball {
    border-radius: 50%;
    background-image: radial-gradient(circle at 34% 30%, rgba(255,255,255,0.85), rgba(255,255,255,0) 42%);
    box-shadow: inset -10px -12px 26px rgba(0,0,0,0.45);
  }
  @keyframes spinCW  { to { transform: rotate(360deg); } }
  @keyframes spinCCW { to { transform: rotate(-360deg); } }
  .rotor { transform-origin: 50% 50%; }
  .cw  { animation: spinCW  0.12s linear infinite; }
  .ccw { animation: spinCCW 0.12s linear infinite; }

  /* Control panel */
  #panel {
    position: fixed; top: 14px; left: 14px; z-index: 10;
    background: rgba(10, 16, 24, 0.82); color: #e8ecf3;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 14px 16px; width: 250px;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    backdrop-filter: blur(6px);
    transition: opacity 0.25s;
  }
  #panel.hidden { opacity: 0; pointer-events: none; }
  #panel h1 { font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; color: #7fb5e6; }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #aab4c4; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
  .row label span { color: #e8ecf3; }
  input[type=range] { width: 100%; accent-color: #4a90d9; }
  select, button {
    width: 100%; padding: 6px 8px; border-radius: 8px;
    background: #0a0e15; color: #e8ecf3; border: 1px solid rgba(255,255,255,0.15);
    font: inherit; cursor: pointer;
  }
  .btnrow { display: flex; gap: 6px; }
  .btnrow button { flex: 1; }
  .hint { margin-top: 10px; font-size: 10.5px; color: #7d8899; line-height: 1.5; }
  kbd { background: #1b2432; border: 1px solid rgba(255,255,255,0.15); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
  <div id="sky"></div>

  <div id="panel">
    <h1>Drone Target Range</h1>
    <div class="row">
      <label>Target <span id="targetVal">Drone</span></label>
      <select id="target">
        <option value="drone">Drone (on sky)</option>
        <option value="ball">Ball (on black)</option>
      </select>
    </div>
    <div class="row" id="ballColorRow" style="display:none">
      <label>Ball color</label>
      <input type="color" id="ballColor" value="#ffffff"
             style="width:100%;height:34px;padding:2px;background:#0a0e15;border:1px solid rgba(255,255,255,0.15);border-radius:8px;cursor:pointer;" />
    </div>
    <div class="row">
      <label>Path <span id="modeVal">Wander</span></label>
      <select id="mode">
        <option value="wander">Wander (realistic)</option>
        <option value="sweepH">Sweep &#8596; (pan test)</option>
        <option value="sweepV">Sweep &#8597; (tilt test)</option>
        <option value="zoom">Zoom &#8857; (distance test)</option>
        <option value="figure8">Figure-8</option>
        <option value="pinpoint">Pinpoint (random pop-ups)</option>
      </select>
    </div>
    <div class="row">
      <label>Size <span id="sizeVal">1.0&#215;</span></label>
      <input type="range" id="size" min="20" max="300" value="100" />
    </div>
    <div class="row">
      <label>Speed <span id="speedVal">1.0&#215;</span></label>
      <input type="range" id="speed" min="0" max="300" value="100" />
    </div>
    <div class="row">
      <label>Spawn radius <span id="spawnVal">60%</span></label>
      <input type="range" id="spawn" min="5" max="100" value="60" />
    </div>
    <div class="row">
      <label>Drones <span id="countVal">1</span></label>
      <input type="range" id="count" min="1" max="4" value="1" />
    </div>
    <div class="btnrow">
      <button id="jerky">Jerky: OFF</button>
      <button id="clouds">Clouds: ON</button>
    </div>
    <div class="hint">
      <kbd>H</kbd> hide panel &middot; <kbd>F</kbd> fullscreen &middot; <kbd>Space</kbd> pause<br>
      Point the turret camera at this screen.
    </div>
  </div>

  target: 'drone',       // 'drone' (on sky) | 'ball' (colored ball on black)

                         // as % of half the smaller screen dimension (keeps

// ---- Drone entity ----
class Drone {
  constructor() {
    this.el = document.createElement('div');
    this.el.className = 'drone';
    this.el.innerHTML = droneSVG();
    sky.appendChild(this.el);
    this.reset();
    this.phase = Math.random() * Math.PI * 2;   // for zoom/figure8/bob
    this.t = Math.random() * 1000;
    this.a = Math.random() * 100;   // speed-scaled phase (no teleport on speed change)
  }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H * 0.7 + H * 0.1;
    const a = Math.random() * Math.PI * 2;
    this.vx = Math.cos(a); this.vy = Math.sin(a);
    this.ppTimer = 0.8;    // pinpoint: seconds left in the current show/gap phase
    this.hidden = false;   // pinpoint: whether we're in a blank gap right now
  }
  remove() { this.el.remove(); }

  step(dt) {
    this.t += dt;
    this.a += dt * cfg.speed;
    const base = 220 * cfg.speed;           // px/sec at speed 1.0
    let scale = cfg.size;
    const margin = 90 * scale;

    if (cfg.mode === 'wander') {
      // small random steering; occasional jerks
      const steer = (cfg.jerky && Math.random() < 0.02) ? 6 : 0.6;
      this.vx += (Math.random() - 0.5) * steer * dt * 4;
      this.vy += (Math.random() - 0.5) * steer * dt * 4;
      const m = Math.hypot(this.vx, this.vy) || 1;
      this.vx /= m; this.vy /= m;
      this.x += this.vx * base * dt;
      this.y += this.vy * base * dt;
      if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx); }
      if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx); }
      if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy); }
      if (this.y > H - margin) { this.y = H - margin; this.vy = -Math.abs(this.vy); }
    } else if (cfg.mode === 'sweepH') {
      this.x += this.vx * base * dt;
      if (this.x < margin) { this.x = margin; this.vx = 1; }
      if (this.x > W - margin) { this.x = W - margin; this.vx = -1; }
      this.y = H / 2 + Math.sin(this.t * 0.8) * H * 0.12;
    } else if (cfg.mode === 'sweepV') {
      this.y += this.vy * base * dt;
      if (this.y < margin) { this.y = margin; this.vy = 1; }
      if (this.y > H - margin) { this.y = H - margin; this.vy = -1; }
      this.x = W / 2 + Math.sin(this.t * 0.8) * W * 0.12;
    } else if (cfg.mode === 'zoom') {
      // drift slowly while size pulses between small (far) and large (near)
      this.x += this.vx * base * 0.35 * dt;
      this.y += this.vy * base * 0.35 * dt;
      if (this.x < margin || this.x > W - margin) this.vx *= -1;
      if (this.y < margin || this.y > H - margin) this.vy *= -1;
      scale = cfg.size * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(this.a * 0.6 + this.phase)));
    } else if (cfg.mode === 'figure8') {
      const cx = W / 2, cy = H / 2;
      const rx = W * 0.32, ry = H * 0.28;
      const a = this.a * 0.6 + this.phase;
      this.x = cx + Math.sin(a) * rx;
      this.y = cy + Math.sin(a * 2) * ry * 0.6;
    } else if (cfg.mode === 'pinpoint') {
      // Pop up at a random spot, hold, blank out briefly, then reappear
      // elsewhere. The blank makes the tracker actually lose lock so it has to
      // re-acquire from scratch at a new location — the pinpoint/acquire test.
      this.vx = this.vy = 0;
      this.ppTimer -= dt;
      if (this.ppTimer <= 0) {
        if (this.hidden) {
          this.hidden = false;               // reappear at a fresh random spot,
          // constrained to a disk of radius R around center so it stays inside
          // the camera's field of view (Spawn radius control).
          const R = (cfg.spawnPct / 100) * Math.min(W, H) / 2;
          const ang = Math.random() * Math.PI * 2;
          const rad = Math.sqrt(Math.random()) * R;   // uniform over the disk
          this.x = Math.max(margin, Math.min(W - margin, W / 2 + Math.cos(ang) * rad));
          this.y = Math.max(margin, Math.min(H - margin, H / 2 + Math.sin(ang) * rad));
          this.ppTimer = 0.6 + Math.random() * 0.9;   // dwell 0.6–1.5 s
        } else {
          this.hidden = true;                // blank out so the tracker loses it
          this.ppTimer = 0.15 + Math.random() * 0.35; // gap 0.15–0.5 s
        }
      }
    }

    // subtle bob + banking tilt for life-like motion
    const bob = Math.sin(this.t * 4 + this.phase) * 3;
    const tilt = cfg.target === 'ball' ? 0 : Math.max(-18, Math.min(18, this.vx * 14));
    this.el.style.opacity = this.hidden ? '0' : '1';   // pinpoint blank; 1 otherwise
    this.el.style.transform =
      `translate(${this.x}px, ${this.y + bob}px) translate(-50%,-50%) scale(${scale}) rotate(${tilt}deg)`;
  }
}

// ---- Clouds ----
let clouds = [];
function buildClouds() {
  clouds.forEach(c => c.el.remove());
  clouds = [];
  if (!cfg.clouds || cfg.target === 'ball') return;   // no clouds on the black ball bg
  const n = 6;
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    el.className = 'cloud';
    const w = 180 + Math.random() * 320;
    el.style.width = w + 'px';
    el.style.height = (w * 0.5) + 'px';
    const y = Math.random() * H * 0.8;
    clouds.push({ el, x: Math.random() * W, y, w, spd: 6 + Math.random() * 14 });
    sky.appendChild(el);
  }
}

// ---- Manage drone count ----
let drones = [];
function syncCount() {
  while (drones.length < cfg.count) drones.push(new Drone());
  while (drones.length > cfg.count) drones.pop().remove();
}

// ---- Main loop ----
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;               // clamp after tab-switch
  if (!cfg.paused) {
    for (const d of drones) d.step(dt);
    for (const c of clouds) {
      c.x -= c.spd * dt;
      if (c.x < -c.w) c.x = W + c.w;
      c.el.style.transform = `translate(${c.x}px, ${c.y}px)`;
    }
  }
  requestAnimationFrame(frame);
}

// ---- Controls ----
const $ = id => document.getElementById(id);
$('mode').onchange = e => { cfg.mode = e.target.value; $('modeVal').textContent = e.target.selectedOptions[0].text.split(' ')[0]; drones.forEach(d => d.reset()); };
$('size').oninput = e => { cfg.size = e.target.value / 100; $('sizeVal').textContent = cfg.size.toFixed(1) + '×'; };
$('speed').oninput = e => { cfg.speed = e.target.value / 100; $('speedVal').textContent = cfg.speed.toFixed(1) + '×'; };
$('spawn').oninput = e => { cfg.spawnPct = +e.target.value; $('spawnVal').textContent = e.target.value + '%'; };
$('count').oninput = e => { cfg.count = +e.target.value; $('countVal').textContent = e.target.value; syncCount(); };
$('jerky').onclick = e => { cfg.jerky = !cfg.jerky; e.target.textContent = 'Jerky: ' + (cfg.jerky ? 'ON' : 'OFF'); };
$('clouds').onclick = e => { cfg.clouds = !cfg.clouds; e.target.textContent = 'Clouds: ' + (cfg.clouds ? 'ON' : 'OFF'); buildClouds(); };

function applyBackground() {
  const ball = cfg.target === 'ball';
  sky.style.background = ball ? '#000' : '';   // '' reverts to the CSS sky gradient
  buildClouds();                               // buildClouds skips clouds in ball mode
}
function rebuildDrones() {
  drones.forEach(d => d.remove());
  drones = [];
  syncCount();                                 // recreates sprites (drone img or ball)
}
$('target').onchange = e => {
  cfg.target = e.target.value;
  $('targetVal').textContent = cfg.target === 'ball' ? 'Ball' : 'Drone';
  $('ballColorRow').style.display = cfg.target === 'ball' ? '' : 'none';
  applyBackground();
  rebuildDrones();
};
$('ballColor').oninput = e => { cfg.ballColor = e.target.value; if (cfg.target === 'ball') rebuildDrones(); };

document.addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') $('panel').classList.toggle('hidden');
  if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
  if (e.code === 'Space') { e.preventDefault(); cfg.paused = !cfg.paused; }
});

window.addEventListener('resize', () => { W = window.innerWidth; H = window.innerHeight; buildClouds(); });

// ---- Boot ----
buildClouds();
syncCount();
requestAnimationFrame(frame);
</script>
</body>
</html>
